// DAILY REPORT — SAVE & VIEW
// ═══════════════════════════════════════════════════════════
function getDayReports(){
  try{ return JSON.parse(localStorage.getItem('fm_day_reports')||'[]'); }catch(e){ return []; }
}
function saveDayReports(reports){
  // Strip b64 photos from saved reports to save space — keep metadata only
  localStorage.setItem('fm_day_reports', JSON.stringify(reports));
}

function saveDayReport(){
  const reports=getDayReports();
  const dateStr=today();
  const timeStr=nowStr();
  const rowInfo=ROWS.find(r=>r.row===sheetRow)||{time:'?',label:'?'};

  // Build issues list from specialData
  const issues=[];
  if(specialData.breakers){
    ['cb_tripped','ac_tripped'].forEach(id=>{
      const b=specialData.breakers[id];
      if(b?.tripped) issues.push({type:'fault',area:'Electrical',desc:(id==='cb_tripped'?'Circuit Breaker':'AC Unit')+' tripped',action:b.restored?'Restored':'Call logged',note:b.note||''});
    });
  }
  if(specialData.lights){
    Object.entries(specialData.lights).forEach(([id,lt])=>{
      if(lt?.faulty){
        const zoneName=ZONES.find(z=>'lt_'+z.id===id)?.label||id;
        issues.push({type:'fault',area:'Electrical',desc:'Faulty lights — '+zoneName,action:lt.fixed?'Fixed':'Call logged',note:lt.note||''});
      }
    });
  }
  if(specialData.toilets_blocked){
    Object.entries(specialData.toilets_blocked).forEach(([id,t])=>{
      if(t?.found) issues.push({type:'fault',area:'Plumbing',desc:'Blocked toilet — '+id.replace('toilet_','').toUpperCase(),action:t.action,note:t.note||''});
    });
  }
  if(specialData.toilet_seats){
    Object.entries(specialData.toilet_seats).forEach(([id,t])=>{
      if(t?.found) issues.push({type:'warn',area:'Facilities',desc:'Damaged toilet seat — '+id.replace('seat_','').toUpperCase(),action:t.action,note:t.note||''});
    });
  }
  if(specialData.cleaning){
    ['Dynamic','Resolve'].forEach(co=>{
      const c=specialData.cleaning[co];
      if(c?.issues) issues.push({type:'warn',area:'Cleaning',desc:'Cleaning issue — '+co,action:'Noted',note:c.note||''});
    });
  }

  // Headcount summary per zone per round
  const hcSummary={};
  ZONES.forEach(z=>{ const d=data[z.id]; if(d?.hc!==undefined) hcSummary[z.label]=d.hc; });

  // Windows & blinds summary
  const blindsSummary=[];
  ZONES.forEach(z=>{
    const d=data[z.id];
    if(d?.blindsOpen){
      blindsSummary.push({zone:z.label,windows:d.windowCount||0,blinds:d.blindsCount||0});
    }
  });

  // Contractor info
  const contractors=specialData.contractors?.onSite?{
    name:specialData.contractors.name,
    work:specialData.contractors.work,
    status:specialData.contractorStatus?.status||'on site'
  }:null;

  const round={
    row:sheetRow,
    time:rowInfo.time,
    label:rowInfo.label,
    capturedAt:timeStr,
    zones:JSON.parse(JSON.stringify(data)),
    issues,
    hcSummary,
    blindsSummary,
    maintenance:JSON.parse(JSON.stringify(maintItems)),
    contractors,
    photoCount:photos.length
  };

  // Find or create today's report
  const existingIdx=reports.findIndex(r=>r.date===dateStr);
  if(existingIdx>=0){
    // Add or replace this round
    const existing=reports[existingIdx];
    const roundIdx=existing.rounds.findIndex(r=>r.row===sheetRow);
    if(roundIdx>=0) existing.rounds[roundIdx]=round; else existing.rounds.push(round);
    existing.rounds.sort((a,b)=>a.row-b.row);
    reports[existingIdx]=existing;
  } else {
    reports.unshift({date:dateStr,rounds:[round],inspector:''});
  }

  saveDayReports(reports);
  showToast('Day report saved ✓','ok');
  showDayReports();
}

function showDayReports(){
  const reports=getDayReports();
  const el=document.getElementById('dayReportArea');
  if(!el)return;

  if(reports.length===0){
    el.innerHTML=`<div class="day-report" style="margin-top:16px"><div class="day-report-hdr"><span class="day-report-title">DAILY REPORTS</span></div><div style="padding:20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px">No reports saved yet. Complete a round and tap Save Day Report.</div></div>`;
    return;
  }

  const reportsHtml=reports.map((report,ri)=>`
    <div class="saved-day-row">
      <div class="saved-day-hdr" onclick="toggleDayReport(${ri})">
        <div>
          <div class="saved-day-title">${formatDate(report.date)}</div>
          <div class="saved-day-meta">${report.rounds.length} round${report.rounds.length!==1?'s':''} · ${report.rounds.reduce((s,r)=>s+r.issues.length,0)} issues · ${report.rounds.reduce((s,r)=>s+r.maintenance.length,0)} maintenance items</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="copy-btn" onclick="event.stopPropagation();exportDayReport(${ri})">Export</button>
          <button class="copy-btn" onclick="event.stopPropagation();deleteDayReport(${ri})" style="border-color:var(--red);color:var(--red)">Delete</button>
          <span id="day-arrow-${ri}" style="color:var(--muted);font-size:14px">▾</span>
        </div>
      </div>
      <div class="saved-day-body" id="day-body-${ri}">
        ${renderDayReportBody(report)}
      </div>
    </div>`).join('');

  el.innerHTML=`
    <div style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-family:var(--display);font-size:13px;letter-spacing:1px;color:var(--accent)">DAILY REPORTS</div>
        <button class="btn btn-outline" style="font-size:11px;padding:6px 12px" onclick="showWeeklySummary()">📈 Weekly Summary</button>
      </div>
      <div class="saved-days">${reportsHtml}</div>
    </div>`;
}

function renderDayReportBody(report){
  const allIssues=report.rounds.flatMap(r=>r.issues);
  const allMaint=report.rounds.flatMap(r=>r.maintenance);
  const allContractors=report.rounds.filter(r=>r.contractors).map(r=>r.contractors);

  // Build headcount table across rounds
  const roundLabels=report.rounds.map(r=>`Row ${r.row}<br><span style="font-size:9px;color:var(--muted)">${r.time}</span>`);
  const hcTableRows=ZONES.map(z=>{
    const cells=report.rounds.map(r=>{
      const hc=r.hcSummary[z.label];
      return `<td style="text-align:center;font-family:var(--mono);font-size:12px;color:var(--green)">${hc!==undefined?hc:'—'}</td>`;
    }).join('');
    return `<tr><td class="td-zone">${z.label}</td>${cells}</tr>`;
  }).join('');

  // Blinds & windows per round
  const blindsRows=report.rounds.map(r=>{
    if(!r.blindsSummary||r.blindsSummary.length===0) return `<div style="font-size:12px;color:var(--muted)">Row ${r.row} ${r.time}: All closed ✓</div>`;
    return r.blindsSummary.map(b=>`<div style="font-size:12px;margin-bottom:3px"><span style="color:var(--yellow)">Row ${r.row} ${r.time} · ${b.zone}:</span> ${b.windows} window${b.windows!==1?'s':''}, ${b.blinds} blind${b.blinds!==1?'s':''} open</div>`).join('');
  }).join('');

  return `
    <!-- HEADCOUNT TABLE -->
    <div class="report-section">
      <div class="report-section-title">👥 Headcount Per Zone Per Round</div>
      <div style="overflow-x:auto">
        <table class="report-table">
          <thead><tr>
            <th>Zone</th>
            ${report.rounds.map(r=>`<th style="text-align:center">${roundLabels[report.rounds.indexOf(r)]}</th>`).join('')}
          </thead>
          <tbody>${hcTableRows}</tbody>
        </table>
      </div>
    </div>

    <!-- WINDOWS & BLINDS -->
    <div class="report-section">
      <div class="report-section-title">🪟 Windows &amp; Blinds Open</div>
      ${blindsRows||'<div style="font-size:12px;color:var(--muted)">No open windows or blinds recorded.</div>'}
    </div>

    <!-- ISSUES & FAULTS -->
    <div class="report-section">
      <div class="report-section-title">⚠️ Issues &amp; Faults (${allIssues.length})</div>
      ${allIssues.length===0
        ?'<div style="font-size:12px;color:var(--green)">✓ No issues logged today.</div>'
        :allIssues.map(iss=>`
          <div style="margin-bottom:8px;padding:8px 10px;background:var(--faint);border-radius:6px;border-left:2px solid ${iss.type==='fault'?'var(--red)':'var(--yellow)'}">
            <div style="font-size:12px;font-weight:600">${iss.area} — ${iss.desc}</div>
            <div style="font-size:11px;margin-top:3px">
              <span class="issue-badge ${iss.action==='Restored'||iss.action==='Fixed'?'fixed':iss.action==='Call logged'||iss.action==='Log Call'?'call':iss.type}">${iss.action}</span>
              ${iss.note?`<span style="color:var(--muted);font-size:11px;margin-left:6px">${iss.note}</span>`:''}
            </div>
          </div>`).join('')
      }
    </div>

    <!-- REPAIRS & MAINTENANCE -->
    <div class="report-section">
      <div class="report-section-title">🔧 Repairs &amp; Maintenance (${allMaint.length})</div>
      ${allMaint.length===0
        ?'<div style="font-size:12px;color:var(--muted)">No maintenance items logged today.</div>'
        :allMaint.map(m=>`
          <div style="margin-bottom:8px;padding:8px 10px;background:var(--faint);border-radius:6px;border-left:2px solid var(--warm)">
            <div style="font-size:12px;font-weight:600">${m.category} — ${m.description||'(No description)'}</div>
            <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
              <span class="issue-badge ${m.status==='done'?'fixed':m.status==='pending'?'warn':m.status==='logged'?'call':'fault'}">${m.status==='done'?'Completed':m.status==='pending'?'Pending':m.status==='logged'?'Call Logged':'Contractor'}</span>
              ${m.notes?`<span style="color:var(--muted);font-size:11px">${m.notes}</span>`:''}
            </div>
          </div>`).join('')
      }
    </div>

    <!-- CONTRACTORS -->
    ${allContractors.length>0?`
    <div class="report-section">
      <div class="report-section-title">🦺 Contractors</div>
      ${allContractors.map(ct=>`
        <div style="font-size:12px;margin-bottom:4px">
          <strong>${ct.name}</strong> — ${ct.work}
          <span class="issue-badge ${ct.status==='left'?'fixed':'warn'}" style="margin-left:6px">${ct.status}</span>
        </div>`).join('')}
    </div>`:''}

    <!-- AC TEMPERATURES -->
    <div class="report-section">
      <div class="report-section-title">❄️ AC &amp; Room Temperatures (Last Captured)</div>
      ${ZONES.map(z=>{
        // Find last round with AC data for this zone
        for(let i=report.rounds.length-1;i>=0;i--){
          const d=report.rounds[i].zones[z.id];
          if(d?.acNote) return `<div style="font-size:12px;margin-bottom:3px"><span style="color:var(--accent);font-family:var(--mono)">${z.label}:</span> <span style="color:var(--text)">${d.acNote}</span></div>`;
        }
        return `<div style="font-size:12px;color:var(--muted);margin-bottom:3px">${z.label}: not recorded</div>`;
      }).join('')}
    </div>`;
}

function toggleDayReport(i){
  const body=document.getElementById('day-body-'+i);
  const arrow=document.getElementById('day-arrow-'+i);
  if(!body)return;
  const open=body.classList.toggle('open');
  if(arrow)arrow.textContent=open?'▴':'▾';
}

function deleteDayReport(i){
  if(!confirm('Delete this day\'s report? This cannot be undone.'))return;
  const reports=getDayReports();
  reports.splice(i,1);
  saveDayReports(reports);
  showDayReports();
  showToast('Report deleted','ok');
}

function exportDayReport(i){
  const reports=getDayReports();
  const report=reports[i];
  if(!report)return;
  const allIssues=report.rounds.flatMap(r=>r.issues);
  const allMaint=report.rounds.flatMap(r=>r.maintenance);
  const L=[];
  L.push('COLLINSON FM — DAILY REPORT');
  L.push('Date: '+formatDate(report.date));
  L.push('Rounds completed: '+report.rounds.length);
  L.push('');
  L.push('═══ HEADCOUNT ═══');
  report.rounds.forEach(r=>{
    L.push('Row '+r.row+' ('+r.time+' '+r.label+'):');
    ZONES.forEach(z=>{ const hc=r.hcSummary[z.label]; L.push('  '+z.label+': '+(hc!==undefined?hc:'—')); });
  });
  L.push('');
  L.push('═══ WINDOWS & BLINDS ═══');
  report.rounds.forEach(r=>{
    if(r.blindsSummary?.length>0) r.blindsSummary.forEach(b=>L.push('Row '+r.row+' '+r.time+' · '+b.zone+': '+b.windows+' windows, '+b.blinds+' blinds open'));
    else L.push('Row '+r.row+' '+r.time+': All closed');
  });
  L.push('');
  L.push('═══ ISSUES & FAULTS ('+allIssues.length+') ═══');
  allIssues.length===0?L.push('No issues logged.'):allIssues.forEach(iss=>L.push('• ['+iss.type.toUpperCase()+'] '+iss.area+' — '+iss.desc+' | Action: '+iss.action+(iss.note?' | '+iss.note:'')));
  L.push('');
  L.push('═══ REPAIRS & MAINTENANCE ('+allMaint.length+') ═══');
  allMaint.length===0?L.push('No maintenance logged.'):allMaint.forEach(m=>L.push('• ['+m.status.toUpperCase()+'] '+m.category+' — '+(m.description||'No description')+(m.notes?' | '+m.notes:'')));
  L.push('');
  L.push('═══ AC & ROOM TEMPERATURES ═══');
  ZONES.forEach(z=>{
    for(let i=report.rounds.length-1;i>=0;i--){
      const d=report.rounds[i].zones[z.id];
      if(d?.acNote){L.push(z.label+': '+d.acNote);return;}
    }
    L.push(z.label+': Not recorded');
  });

  const blob=new Blob([L.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='FM_DailyReport_'+report.date+'.txt';a.click();
  showToast('Report exported ✓','ok');
}

function formatDate(str){
  return new Date(str+'T00:00:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// ═══════════════════════════════════════════════════════════
// WEEKLY SUMMARY
// ═══════════════════════════════════════════════════════════
function showWeeklySummary(){
  const reports=getDayReports();
  const el=document.getElementById('dayReportArea');
  if(!el)return;

  // Get last 7 days
  const now=new Date();
  const weekAgo=new Date(now-7*86400000);
  const weekReports=reports.filter(r=>new Date(r.date+'T00:00:00')>=weekAgo);

  if(weekReports.length===0){
    el.innerHTML=`<div class="day-report" style="margin-top:16px">
      <div class="day-report-hdr"><span class="day-report-title">WEEKLY SUMMARY</span></div>
      <div style="padding:20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px">No reports in the last 7 days.</div>
    </div>`;
    return;
  }

  const allRounds=weekReports.flatMap(r=>r.rounds);
  const allIssues=allRounds.flatMap(r=>r.issues);
  const allMaint=allRounds.flatMap(r=>r.maintenance);

  // Total headcount per zone across whole week
  const weekHC={};
  ZONES.forEach(z=>{
    weekHC[z.label]=allRounds.reduce((s,r)=>{
      const hc=r.hcSummary?.[z.label];
      return s+(hc!==undefined?hc:0);
    },0);
  });
  const totalHC=Object.values(weekHC).reduce((a,b)=>a+b,0);

  // Issues breakdown
  const issueCats={};
  allIssues.forEach(iss=>{ issueCats[iss.area]=(issueCats[iss.area]||0)+1; });

  // Maintenance breakdown
  const maintCats={};
  allMaint.forEach(m=>{ maintCats[m.category]=(maintCats[m.category]||0)+1; });

  // Most open blinds/windows days
  const openBlindsCount=allRounds.reduce((s,r)=>s+(r.blindsSummary?.length||0),0);
  const totalWindows=allRounds.reduce((s,r)=>s+(r.blindsSummary?.reduce((a,b)=>a+b.windows,0)||0),0);
  const totalBlinds=allRounds.reduce((s,r)=>s+(r.blindsSummary?.reduce((a,b)=>a+b.blinds,0)||0),0);

  // Recurring issues
  const issueFreq={};
  allIssues.forEach(iss=>{ const k=iss.area+': '+iss.desc; issueFreq[k]=(issueFreq[k]||0)+1; });
  const recurring=Object.entries(issueFreq).sort((a,b)=>b[1]-a[1]).slice(0,5);

  el.innerHTML=`
    <div class="day-report" style="margin-top:16px">
      <div class="day-report-hdr">
        <span class="day-report-title">📈 WEEKLY SUMMARY</span>
        <span class="day-report-date">${weekReports.length} days · ${allRounds.length} rounds</span>
      </div>

      <!-- STATS ROW -->
      <div class="report-section">
        <div class="report-section-title">At a Glance</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
          ${[
            {val:weekReports.length,label:'Days Logged',col:'var(--accent)'},
            {val:allRounds.length,label:'Rounds Done',col:'var(--accent)'},
            {val:totalHC,label:'Total Staff Interactions',col:'var(--green)'},
            {val:allIssues.length,label:'Issues Found',col:'var(--red)'},
            {val:allMaint.length,label:'Maintenance Items',col:'var(--warm)'},
            {val:totalWindows+totalBlinds,label:'Open Blinds/Windows',col:'var(--yellow)'},
          ].map(s=>`
            <div style="background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center">
              <div style="font-family:var(--display);font-size:28px;color:${s.col};line-height:1">${s.val}</div>
              <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.05em">${s.label}</div>
            </div>`).join('')}
        </div>
      </div>

      <!-- HEADCOUNT BY ZONE -->
      <div class="report-section">
        <div class="report-section-title">👥 Total Headcount by Zone (Week)</div>
        ${ZONES.map(z=>`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <div style="font-size:12px;width:130px;flex-shrink:0">${z.label}</div>
            <div style="flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden">
              <div style="height:100%;background:var(--green);border-radius:3px;width:${totalHC>0?Math.round(weekHC[z.label]/totalHC*100):0}%;transition:width .4s"></div>
            </div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--green);width:30px;text-align:right">${weekHC[z.label]}</div>
          </div>`).join('')}
      </div>

      <!-- ISSUES BREAKDOWN -->
      <div class="report-section">
        <div class="report-section-title">⚠️ Issues by Category</div>
        ${Object.keys(issueCats).length===0
          ?'<div style="font-size:12px;color:var(--green)">✓ No issues logged this week!</div>'
          :Object.entries(issueCats).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>`
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <div style="font-size:12px;width:110px;flex-shrink:0">${cat}</div>
              <div style="flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden">
                <div style="height:100%;background:var(--red);border-radius:3px;width:${Math.round(count/allIssues.length*100)}%"></div>
              </div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--red);width:20px;text-align:right">${count}</div>
            </div>`).join('')
        }
      </div>

      <!-- RECURRING ISSUES -->
      ${recurring.length>0?`
      <div class="report-section">
        <div class="report-section-title">🔁 Recurring Issues</div>
        ${recurring.map(([desc,count])=>`
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:6px 10px;background:var(--faint);border-radius:5px">
            <div style="font-size:12px;flex:1">${desc}</div>
            <span class="issue-badge fault">${count}x</span>
          </div>`).join('')}
      </div>`:''}

      <!-- MAINTENANCE BREAKDOWN -->
      <div class="report-section">
        <div class="report-section-title">🔧 Maintenance by Category</div>
        ${Object.keys(maintCats).length===0
          ?'<div style="font-size:12px;color:var(--muted)">No maintenance logged this week.</div>'
          :Object.entries(maintCats).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>`
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <div style="font-size:12px;width:110px;flex-shrink:0">${cat}</div>
              <div style="flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden">
                <div style="height:100%;background:var(--warm);border-radius:3px;width:${allMaint.length>0?Math.round(count/allMaint.length*100):0}%"></div>
              </div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--warm);width:20px;text-align:right">${count}</div>
            </div>`).join('')
        }
      </div>

      <!-- WINDOWS & BLINDS -->
      <div class="report-section">
        <div class="report-section-title">🪟 Windows &amp; Blinds Summary</div>
        <div style="font-size:13px;margin-bottom:8px">
          <span style="color:var(--yellow);font-family:var(--mono)">${totalWindows}</span> total windows open recorded &nbsp;·&nbsp;
          <span style="color:var(--yellow);font-family:var(--mono)">${totalBlinds}</span> total blinds open recorded
        </div>
        ${allRounds.filter(r=>r.blindsSummary?.length>0).length===0
          ?'<div style="font-size:12px;color:var(--green)">✓ No open blinds or windows this week.</div>'
          :weekReports.map(rep=>{
            const dayOpen=rep.rounds.flatMap(r=>r.blindsSummary||[]);
            if(dayOpen.length===0)return '';
            return `<div style="margin-bottom:6px"><div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:3px">${formatDate(rep.date)}</div>
              ${dayOpen.map(b=>`<div style="font-size:12px;padding-left:10px">• ${b.zone}: ${b.windows} window${b.windows!==1?'s':''}, ${b.blinds} blind${b.blinds!==1?'s':''}</div>`).join('')}</div>`;
          }).join('')
        }
      </div>

      <!-- EXPORT -->
      <div class="report-section" style="border-bottom:none">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-green" onclick="exportWeeklyReport()">⬇ Export Weekly Report</button>
          <button class="btn btn-outline" onclick="showDayReports()">← Back to Daily Reports</button>
        </div>
      </div>
    </div>`;
}

function exportWeeklyReport(){
  const reports=getDayReports();
  const now=new Date();
  const weekAgo=new Date(now-7*86400000);
  const weekReports=reports.filter(r=>new Date(r.date+'T00:00:00')>=weekAgo);
  if(weekReports.length===0){showToast('No data to export','err');return;}

  const allRounds=weekReports.flatMap(r=>r.rounds);
  const allIssues=allRounds.flatMap(r=>r.issues);
  const allMaint=allRounds.flatMap(r=>r.maintenance);

  const L=[];
  L.push('COLLINSON FM — WEEKLY SUMMARY REPORT');
  L.push('Period: '+formatDate(weekReports[weekReports.length-1].date)+' to '+formatDate(weekReports[0].date));
  L.push('Generated: '+new Date().toLocaleString('en-ZA'));
  L.push('Days: '+weekReports.length+' | Rounds: '+allRounds.length);
  L.push('');
  L.push('═══════════════════════════════════');
  L.push('ISSUES & FAULTS ('+allIssues.length+' total)');
  L.push('═══════════════════════════════════');
  allIssues.length===0?L.push('None.'):allIssues.forEach(i=>L.push('• ['+i.type.toUpperCase()+'] '+i.area+' — '+i.desc+' | '+i.action+(i.note?' | '+i.note:'')));
  L.push('');
  L.push('═══════════════════════════════════');
  L.push('REPAIRS & MAINTENANCE ('+allMaint.length+' total)');
  L.push('═══════════════════════════════════');
  allMaint.length===0?L.push('None.'):allMaint.forEach(m=>L.push('• ['+m.status.toUpperCase()+'] '+m.category+' — '+(m.description||'No description')+(m.notes?' | '+m.notes:'')));
  L.push('');
  L.push('═══════════════════════════════════');
  L.push('HEADCOUNT BY ZONE (cumulative)');
  L.push('═══════════════════════════════════');
  ZONES.forEach(z=>{
    const total=allRounds.reduce((s,r)=>s+(r.hcSummary?.[z.label]||0),0);
    L.push(z.label+': '+total);
  });
  L.push('');
  L.push('═══════════════════════════════════');
  L.push('WINDOWS & BLINDS OPEN (by day)');
  L.push('═══════════════════════════════════');
  weekReports.forEach(rep=>{
    const dayOpen=rep.rounds.flatMap(r=>r.blindsSummary||[]);
    L.push(formatDate(rep.date)+': '+(dayOpen.length===0?'All closed':dayOpen.map(b=>b.zone+' ('+b.windows+'W, '+b.blinds+'B)').join(', ')));
  });

  const blob=new Blob([L.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='FM_WeeklyReport_'+today()+'.txt';a.click();
  showToast('Weekly report exported ✓','ok');
}

// ═══════════════════════════════════════════════════════════
// WHATSAPP SUMMARY (Row 14 only)
// ═══════════════════════════════════════════════════════════
function generateWA(){
  const lines=['Good evening all,'];
  ZONES.slice().reverse().forEach(z=>{
    const d=data[z.id]||{};
    const hc=d.hc??0;
    const wc=d.windowCount||0;
    const bc=d.blindsCount||0;
    const blindsClosed=!d.blindsOpen;
    let line=`${z.label}:\n`;
    if(hc===0) line+=`No staff members working in the area. `;
    else if(hc===1) line+=`1 staff member working in the area. `;
    else line+=`${hc} staff members working in the area. `;
    line+=`All aircons switched off`;
    if(blindsClosed){ line+=`, all blinds closed and all windows closed.`; }
    else{
      const parts=[];
      if(wc>0)parts.push(wc===1?'one window':wc+' windows');
      if(bc>0)parts.push(bc===1?'one blind':bc+' blinds');
      line+=`. ${parts.join(' and ')+' open'}.`;
    }
    const lightKey='lt_'+z.id;
    const lt=specialData?.lights?.[lightKey];
    if(lt?.faulty){line+=lt.fixed?' Lights replaced.':' Faulty lights — call logged.';}
    else{line+=' All lights switched off.';}
    lines.push(line);
  });
  const msg=lines.join('\n\n');
  document.getElementById('waArea').innerHTML=`
    <div class="wa-card" style="margin-top:16px">
      <div class="wa-hdr">
        <span>📱 WhatsApp Summary</span>
        <span style="font-size:11px;opacity:.7">Row 14 · ${nowStr()}</span>
      </div>
      <div class="wa-body">
        <div class="wa-bubble">${msg.replace(/\n/g,'<br>')}</div>
        <div class="wa-time">${nowStr()} ✓✓</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-wa" onclick="copyWA()">📋 Copy Message</button>
          <button class="btn btn-outline" style="font-size:12px" onclick="editWA()">✎ Edit</button>
        </div>
      </div>
    </div>`;
  window._waMsg=msg;
}
function copyWA(){
  navigator.clipboard.writeText(window._waMsg||'').then(()=>showToast('WhatsApp message copied ✓','ok'));
}
function editWA(){
  const el=document.querySelector('.wa-bubble');if(!el)return;
  const ta=document.createElement('textarea');
  ta.value=window._waMsg||'';
  ta.style.cssText='width:100%;min-height:200px;background:#fff;color:#111;border:none;border-radius:8px;padding:12px;font-size:13px;font-family:var(--body);line-height:1.6;resize:vertical';
  ta.oninput=()=>{window._waMsg=ta.value;};
  el.parentNode.replaceChild(ta,el);ta.focus();
}

// ═══════════════════════════════════════════════════════════
// SCRIPT GENERATION
// ═══════════════════════════════════════════════════════════
function showScript(){
  const raw=generateRawScript();
  const hl=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/.*)/g,'<span style="color:#334455">$1</span>')
    .replace(/\b(function|const|var|let|return)\b/g,'<span style="color:#4fc1e9">$1</span>')
    .replace(/'([^']*)'/g,"<span style='color:#a8e6cf'>'$1'</span>")
    .replace(/\b(\d+\.?\d*)\b/g,'<span style="color:#ffd3a0">$1</span>');
  document.getElementById('scriptArea').innerHTML=`
    <div class="script-out" style="margin-top:16px">
      <div class="script-out-hdr">
        <span>Apps Script · Row ${sheetRow}</span>
        <button class="copy-btn" id="copyScriptBtn" onclick="copyScript()">Copy Script</button>
      </div>
      <div class="code-block">${hl}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-green" onclick="copyScript()">📋 Copy Script</button>
      <button class="btn btn-outline" onclick="downloadScript()">⬇ Download .gs</button>
    </div>`;
  document.getElementById('scriptArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function generateRawScript(){
  const L=[];
  L.push('// COLLINSON FM — Walkabout Data Entry');
  L.push('// Row: '+sheetRow+' | Generated: '+new Date().toLocaleString('en-ZA'));
  L.push('// 1. Open Google Sheet → Extensions → Apps Script');
  L.push('// 2. Paste, click Run ▶, grant permissions');
  L.push('');
  const ct=specialData.contractors;
  if(ct?.onSite)L.push('// CONTRACTOR: '+ct.name+' — '+ct.work);
  const cs=specialData.contractorStatus;
  if(cs)L.push('// CONTRACTOR STATUS: '+cs.status+(cs.departTime?' at '+cs.departTime:''));
  const cl=specialData.cleaning;
  if(cl)['Dynamic','Resolve'].forEach(co=>{if(cl[co])L.push('// CLEANING '+co+': '+(cl[co].issues?'ISSUES — '+cl[co].note:'OK'));});
  if(L[L.length-1]!=='')L.push('');
  L.push('function fillWalkabout() {');
  L.push("  const ss = SpreadsheetApp.openById('"+SHEET_ID+"');");
  L.push("  const sheet = ss.getSheets()[0];");
  L.push('');
  ZONES.forEach(z=>{
    const d=data[z.id]||{};
    L.push('  // '+z.label);
    L.push("  sheet.getRange('"+z.cols.ac+sheetRow+"').setValue("+JSON.stringify(d.acNote??'—')+');');
    L.push("  sheet.getRange('"+z.cols.hc+sheetRow+"').setValue("+(d.hc!==undefined?d.hc:0)+');');
    L.push("  sheet.getRange('"+z.cols.blinds+sheetRow+"').setValue("+JSON.stringify(d.blindsStr??'—')+');');
    L.push('');
  });
  L.push("  SpreadsheetApp.flush();");
  L.push("  SpreadsheetApp.getUi().alert('Row "+sheetRow+" filled!');");
  L.push('}');
  return L.join('\n');
}
function copyScript(){
  navigator.clipboard.writeText(generateRawScript()).then(()=>{
    const b=document.getElementById('copyScriptBtn');
    if(b){b.textContent='✓ Copied!';b.classList.add('done');setTimeout(()=>{b.textContent='Copy Script';b.classList.remove('done');},2500);}
    showToast('Script copied ✓','ok');
  });
}
function downloadScript(){
  const blob=new Blob([generateRawScript()],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='collinson_row'+sheetRow+'_'+today()+'.gs';a.click();
  showToast('Script downloaded ✓','ok');
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show '+type;setTimeout(()=>t.className='toast',3000);
}

init();
