<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FM Walkabout Wizard — Collinson</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d;--surface:#0d1117;--card:#111820;--raised:#161e28;
  --border:#1c2535;--border2:#243040;
  --accent:#00c8ff;--accent-dim:rgba(0,200,255,.1);--accent-glow:rgba(0,200,255,.04);
  --warm:#ff8c42;--warm-dim:rgba(255,140,66,.12);
  --green:#00e5a0;--green-dim:rgba(0,229,160,.1);
  --red:#ff4455;--red-dim:rgba(255,68,85,.1);
  --yellow:#ffd166;--text:#c8dae8;--muted:#3d5468;--faint:#1a2535;
  --mono:'JetBrains Mono',monospace;--display:'Orbitron',sans-serif;--body:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.025) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 40%,transparent);opacity:.35}
.hdr-logo{font-family:var(--display);font-size:13px;letter-spacing:2px;color:var(--accent)}
.hdr-right{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.05em}
.pill-blue{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.pill-warm{border-color:var(--warm);color:var(--warm);background:var(--warm-dim)}
.pill-green{border-color:var(--green);color:var(--green);background:var(--green-dim)}

.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:20px 14px 80px}

/* PROGRESS */
.progress-track{margin-bottom:20px}
.progress-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.progress-zone-name{font-family:var(--display);font-size:11px;letter-spacing:1.5px;color:var(--accent)}
.progress-count{font-family:var(--mono);font-size:10px;color:var(--muted)}
.progress-bar-outer{height:3px;background:var(--faint);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .4s ease}
.zone-dots{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.zone-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);border:1px solid var(--border2);transition:all .3s}
.zone-dot.done{background:var(--green);border-color:var(--green)}
.zone-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}

/* QUESTION CARD */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q-top{padding:14px 18px;background:var(--raised);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.q-step-badge{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--faint);border:1px solid var(--border2);padding:3px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.04em}
.q-zone-tag{font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--accent);flex:1}
.q-body{padding:20px 18px}
.q-label{font-family:var(--display);font-size:15px;letter-spacing:.5px;line-height:1.4;margin-bottom:18px;color:var(--text)}
.q-sublabel{font-size:12px;color:var(--muted);margin-top:-12px;margin-bottom:16px;font-family:var(--mono);letter-spacing:.03em}

/* PHOTO CAPTURE */
.photo-zone{border:2px dashed var(--border2);border-radius:10px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;background:var(--surface);margin-bottom:14px}
.photo-zone:hover,.photo-zone:active{border-color:var(--accent);background:var(--accent-glow)}
.photo-zone.captured{border-style:solid;border-color:var(--green)}
.photo-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;border-radius:8px}
.photo-zone img.show{display:block}
.photo-prompt{text-align:center;color:var(--muted)}
.cam-circle{width:64px;height:64px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:26px;transition:all .2s}
.photo-zone:hover .cam-circle{border-color:var(--accent);box-shadow:0 0 16px var(--accent-dim)}
.photo-label{font-size:13px;letter-spacing:.04em;margin-top:4px}
.photo-hint{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}

/* SAVED PHOTO THUMBNAIL */
.thumb-row{display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:10px}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--border2);cursor:pointer;flex-shrink:0}
.thumb-label{font-family:var(--mono);font-size:10px;color:var(--muted)}
.thumb-dl{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;font-family:var(--mono)}

/* SCAN OVERLAY */
.scan-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:8px;z-index:10}
.scan-overlay.show{display:flex}
.scan-line{width:80%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scanAnim 1.2s ease-in-out infinite alternate}
@keyframes scanAnim{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.scan-text{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}

/* READING RESULT */
.reading-result{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:none;margin-bottom:14px}
.reading-result.show{display:flex;align-items:center;gap:14px}
.reading-temp{font-family:var(--display);font-size:42px;letter-spacing:1px;line-height:1}
.reading-temp.ac-col{color:var(--accent)}
.reading-temp.room-col{color:var(--warm)}
.reading-meta{flex:1}
.reading-meta-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.reading-meta-edit{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.temp-edit{background:var(--faint);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:13px;padding:4px 8px;width:80px;outline:none}
.temp-edit:focus{border-color:var(--accent)}
.retake-btn{background:none;border:1px solid var(--border2);border-radius:6px;padding:6px 12px;color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;letter-spacing:.04em}
.retake-btn:hover{border-color:var(--accent);color:var(--accent)}

/* HEADCOUNT */
.hc-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px}
.hc-btn{width:54px;height:54px;border-radius:50%;border:2px solid var(--border2);background:var(--raised);color:var(--text);font-size:22px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;user-select:none;font-family:var(--body)}
.hc-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.hc-btn:active{transform:scale(.92)}
.hc-display{font-family:var(--display);font-size:64px;letter-spacing:2px;color:var(--green);min-width:100px;text-align:center;line-height:1}
.hc-label{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;margin-bottom:10px;margin-top:-8px}

/* BLINDS */
.yn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.yn-btn{padding:18px 10px;border-radius:10px;border:2px solid var(--border2);background:var(--raised);cursor:pointer;text-align:center;transition:all .2s;font-family:var(--display);letter-spacing:.5px;font-size:14px;color:var(--muted)}
.yn-btn .yn-icon{font-size:28px;display:block;margin-bottom:6px}
.yn-btn:hover{border-color:var(--accent);color:var(--text)}
.yn-btn.selected-yes{border-color:var(--yellow);color:var(--yellow);background:rgba(255,209,102,.08)}
.yn-btn.selected-no{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.count-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;animation:slideUp .2s ease}
.count-grid.show{display:grid}
.count-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.count-box-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.count-mini-row{display:flex;align-items:center;justify-content:center;gap:8px}
.count-mini-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:var(--raised);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.count-mini-btn:hover{border-color:var(--accent)}
.count-num{font-family:var(--display);font-size:28px;color:var(--yellow);min-width:36px;text-align:center}

/* SPECIAL STEP ITEMS */
.special-item{background:var(--raised);border:1px solid var(--border2);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.special-item-title{font-size:14px;font-weight:600;margin-bottom:10px}
.yn-small{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:0}
.yn-small-btn{padding:10px;border:2px solid var(--border2);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;font-family:var(--body)}
.yn-small-btn.s-yes{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.yn-small-btn.s-no{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.yn-small-btn.s-fixed{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.yn-small-btn.s-call{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.detail-section{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.detail-section.open{display:block}
.field-label{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.06em}
.txt-input{width:100%;background:var(--faint);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:var(--body);font-size:12px;padding:7px 10px;outline:none}
.txt-input:focus{border-color:var(--accent)}

/* NEXT/BACK BUTTONS */
.nav-row{display:flex;gap:8px;margin-top:4px}
.next-btn{flex:1;padding:16px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#006aff);color:#000;font-family:var(--display);font-size:14px;letter-spacing:1.5px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.next-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,200,255,.25)}
.next-btn:disabled{background:var(--faint);color:var(--muted);transform:none;box-shadow:none;cursor:not-allowed}
.back-btn{padding:16px 18px;border-radius:10px;border:1px solid var(--border2);background:var(--raised);color:var(--muted);font-family:var(--display);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.back-btn:hover{border-color:var(--warm);color:var(--warm)}
.skip-btn{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.skip-btn:hover{border-color:var(--muted);color:var(--text)}

/* REVIEW */
.review-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.review-hdr{padding:12px 16px;background:var(--raised);border-bottom:1px solid var(--border);font-family:var(--display);font-size:12px;letter-spacing:1px;color:var(--accent)}
.review-zone-row{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.review-zone-row:last-child{border-bottom:none}
.review-zone-name{font-weight:600;font-size:13px;width:110px;flex-shrink:0;color:var(--text)}
.review-data{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.rdchip{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.rdchip.ac{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.rdchip.room{border-color:var(--warm);color:var(--warm);background:var(--warm-dim)}
.rdchip.hc{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.rdchip.blinds{border-color:var(--yellow);color:var(--yellow);background:rgba(255,209,102,.08)}

/* SCRIPT */
.script-out{background:#060a0e;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.script-out-hdr{padding:10px 14px;background:#0a1018;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.script-out-hdr span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.code-block{font-family:var(--mono);font-size:11px;line-height:1.8;padding:14px 16px;color:#7ca8c0;overflow-x:auto;white-space:pre;max-height:300px;overflow-y:auto}
.copy-btn{font-family:var(--mono);font-size:10px;padding:4px 12px;border-radius:4px;border:1px solid var(--border2);background:var(--raised);color:var(--muted);cursor:pointer;transition:all .15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.done{border-color:var(--green);color:var(--green)}

/* WHATSAPP */
.wa-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.wa-hdr{padding:12px 16px;background:#075e54;border-bottom:1px solid var(--border);font-family:var(--display);font-size:12px;letter-spacing:1px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.wa-body{padding:14px 16px}
.wa-bubble{background:#dcf8c6;color:#111;border-radius:10px 10px 0 10px;padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;font-family:var(--body);word-break:break-word;margin-bottom:10px}
.wa-time{font-size:10px;color:#555;text-align:right;margin-top:-6px;margin-bottom:10px}

/* PHOTO LOG */
.photo-log{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.photo-log-hdr{padding:12px 16px;background:var(--raised);border-bottom:1px solid var(--border);font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--muted)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px}
.photo-thumb-wrap{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:4/3;cursor:pointer}
.photo-thumb-wrap img{width:100%;height:100%;object-fit:cover}
.photo-thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);padding:3px 5px;font-size:9px;font-family:var(--mono);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-thumb-dl{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border-radius:3px;padding:2px 4px;font-size:9px;color:var(--accent);cursor:pointer;font-family:var(--mono)}

/* REPAIRS & MAINTENANCE INPUT */
.maint-item{background:var(--raised);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.maint-item-num{font-family:var(--display);font-size:18px;color:var(--accent);width:24px;flex-shrink:0;margin-top:2px}
.maint-item-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.maint-cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.maint-cat-btn{padding:4px 10px;border:1px solid var(--border2);border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--mono);background:var(--faint);color:var(--muted);transition:all .15s;white-space:nowrap}
.maint-cat-btn.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.add-maint-btn{width:100%;padding:10px;border:1px dashed var(--border2);border-radius:8px;background:none;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .15s;margin-bottom:14px}
.add-maint-btn:hover{border-color:var(--accent);color:var(--accent)}

/* DAILY REPORT */
.day-report{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.day-report-hdr{padding:14px 18px;background:var(--raised);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.day-report-title{font-family:var(--display);font-size:13px;letter-spacing:1px;color:var(--accent)}
.day-report-date{font-family:var(--mono);font-size:10px;color:var(--muted)}
.report-section{padding:14px 18px;border-bottom:1px solid var(--border)}
.report-section:last-child{border-bottom:none}
.report-section-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.report-table{width:100%;border-collapse:collapse;font-size:12px}
.report-table th{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border)}
.report-table td{padding:7px 8px;border-bottom:1px solid var(--faint);vertical-align:top}
.report-table tr:last-child td{border-bottom:none}
.report-table .td-zone{font-weight:600;color:var(--text)}
.report-table .td-ac{color:var(--accent);font-family:var(--mono);font-size:11px}
.report-table .td-hc{color:var(--green);font-family:var(--mono);font-size:11px}
.report-table .td-blinds{color:var(--yellow);font-family:var(--mono);font-size:11px}
.issue-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);margin:2px;border:1px solid}
.issue-badge.fault{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.issue-badge.warn{border-color:var(--yellow);color:var(--yellow);background:rgba(255,209,102,.08)}
.issue-badge.fixed{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.issue-badge.call{border-color:var(--warm);color:var(--warm);background:var(--warm-dim)}
.maint-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:11px;margin:2px;border:1px solid var(--border2);color:var(--text);background:var(--raised)}
.saved-days{margin-bottom:14px}
.saved-day-row{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
.saved-day-hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.saved-day-hdr:hover{background:var(--raised)}
.saved-day-title{font-family:var(--display);font-size:12px;letter-spacing:.5px;color:var(--text)}
.saved-day-meta{font-family:var(--mono);font-size:10px;color:var(--muted)}
.saved-day-body{display:none;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}
.saved-day-body.open{display:block}

/* DONE SCREEN */
.done-screen{text-align:center;padding:48px 16px;display:none}
.done-screen.show{display:block;animation:slideUp .3s ease}
.done-icon{font-size:56px;margin-bottom:16px}
.done-title{font-family:var(--display);font-size:22px;letter-spacing:2px;color:var(--green);margin-bottom:8px}
.done-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:7px;font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-accent{background:var(--accent);color:#000}
.btn-accent:hover{background:#00b5e8}
.btn-outline{background:none;border:1px solid var(--border2);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green);color:#000}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{background:#1da851}

input[type=file]{display:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:10px 22px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;opacity:0;transition:all .25s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">FM WIZARD</div>
  <div class="hdr-right">
    <div class="pill pill-blue" id="pillStep">START</div>
    <div class="pill pill-warm" id="pillDate"></div>
  </div>
</div>

<div class="wrap">
  <div class="progress-track" id="progressTrack" style="display:none">
    <div class="progress-info">
      <div class="progress-zone-name" id="pgZoneName">—</div>
      <div class="progress-count" id="pgCount">0 / 0</div>
    </div>
    <div class="progress-bar-outer"><div class="progress-bar-fill" id="pgFill" style="width:0%"></div></div>
    <div class="zone-dots" id="zoneDots"></div>
  </div>

  <div id="wizardArea"></div>

  <div class="done-screen" id="doneScreen">
    <div class="done-icon">✅</div>
    <div class="done-title">WALKABOUT COMPLETE</div>
    <div class="done-sub" id="doneSub"></div>
    <div class="btn-row">
      <button class="btn btn-green" onclick="showScript()">⚡ Generate Script</button>
      <button class="btn btn-outline" onclick="showReview()">📋 Review Data</button>
      <button class="btn btn-outline" onclick="showPhotoLog()">📷 Photo Log</button>
    </div>
    <div class="btn-row" id="waRow" style="display:none">
      <button class="btn btn-wa" onclick="generateWA()">💬 Generate WhatsApp Summary</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-accent" onclick="showMaintLog()">🔧 View Maintenance Log</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-accent" onclick="saveDayReport()">💾 Save Day Report</button>
      <button class="btn btn-outline" onclick="showDayReports()">📊 View Daily Reports</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="startOver()">↺ Start Over</button>
    </div>
    <div id="reviewArea"></div>
    <div id="photoLogArea"></div>
    <div id="waArea"></div>
    <div id="maintArea"></div>
    <div id="dayReportArea"></div>
    <div id="scriptArea"></div>
  </div>
</div>

<input type="file" id="fi-ac"   accept="image/*" capture="environment" onchange="handlePhoto(event,'ac')">
<input type="file" id="fi-room" accept="image/*" capture="environment" onchange="handlePhoto(event,'room')">
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
const ZONES = [
  { id:'gf',  label:'Ground Floor',    floor:'GF',  cols:{ ac:'H',  hc:'I',  blinds:'J'  } },
  { id:'1fn', label:'1st Floor North', floor:'1F',  cols:{ ac:'K',  hc:'L',  blinds:'M'  } },
  { id:'1fe', label:'1st Floor East',  floor:'1F',  cols:{ ac:'N',  hc:'O',  blinds:'P'  } },
  { id:'1fs', label:'1st Floor South', floor:'1F',  cols:{ ac:'Q',  hc:'R',  blinds:'S'  } },
  { id:'2fn', label:'2nd Floor North', floor:'2F',  cols:{ ac:'T',  hc:'U',  blinds:'V'  } },
  { id:'2fe', label:'2nd Floor East',  floor:'2F',  cols:{ ac:'W',  hc:'X',  blinds:'Y'  } },
  { id:'2fs', label:'2nd Floor South', floor:'2F',  cols:{ ac:'Z',  hc:'AA', blinds:'AB' } },
  { id:'can', label:'Canteen',         floor:'ALL', cols:{ ac:'AC', hc:'AD', blinds:'AE' } },
];

const ROWS = [
  { row:4,  time:'06:00', label:'Arrival & Setup' },
  { row:6,  time:'08:30', label:'Building Check' },
  { row:7,  time:'09:30', label:'Mid-Morning' },
  { row:8,  time:'10:30', label:'Contractor Check' },
  { row:10, time:'13:00', label:'Afternoon Rounds' },
  { row:11, time:'14:30', label:'Cleaning Check' },
  { row:12, time:'15:30', label:'Mid-Afternoon' },
  { row:13, time:'16:30', label:'Contractor Sign-Off' },
  { row:14, time:'18:20', label:'Switch Off & Close' },
];

const ZONE_STEPS = ['ac','room','hc','blinds'];
const MAINT_CATS = ['HVAC','Electrical','Plumbing','Cleaning','Structural','Safety','General'];
const SHEET_ID   = '1eEtwpoUJVQWQ0WXqp-IAwA62qMQnCUHqVhbtZc6KhTw';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let sheetRow = 4;
let zoneIdx  = 0;
let stepIdx  = 0;
let phase    = 'zones';           // 'special' | 'zones'
let specialStepIdx = 0;
let specialSteps   = [];

let data        = {};   // zone data
let specialData = {};   // special checks
let photos      = [];   // saved photos
let maintItems  = [];   // repairs & maintenance log for this round

// per-zone staging
let tempAC     = null;
let tempRoom   = null;
let hcVal      = 0;
let blindsOpen = false;
let windowCount = 0;
let blindsCount = 0;

// history stack for back navigation: [{phase,zoneIdx,stepIdx,specialStepIdx}]
let history    = [];

function today() { return new Date().toISOString().slice(0,10); }
function nowStr(){ return new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}); }

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function init() {
  document.getElementById('pillDate').textContent =
    new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'short'}).toUpperCase();
  showRowSelector();
}

// ═══════════════════════════════════════════════════════════
// ROW SELECTOR
// ═══════════════════════════════════════════════════════════
function showRowSelector() {
  document.getElementById('progressTrack').style.display = 'none';
  document.getElementById('wizardArea').innerHTML = `
    <div class="q-card">
      <div class="q-top">
        <span class="q-step-badge">SETUP</span>
        <span class="q-zone-tag">SELECT ROUND</span>
      </div>
      <div class="q-body">
        <div class="q-label">Select your time round</div>
        <div class="q-sublabel">// Which row in the sheet are we filling?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">
          ${ROWS.map(r=>`
            <div onclick="selectRow(${r.row},this)" class="row-opt"
              style="padding:12px;border:2px solid var(--border2);border-radius:8px;text-align:center;cursor:pointer;transition:all .15s;background:var(--raised)">
              <div style="font-family:var(--display);font-size:10px;letter-spacing:.5px;color:var(--accent)">ROW ${r.row} &middot; ${r.time}</div>
              <div style="font-size:12px;margin-top:4px;color:var(--text)">${r.label}</div>
              ${r.row===6?'<div style="font-family:var(--mono);font-size:9px;color:var(--red);margin-top:3px">&#9889; BUILDING CHECK</div>':''}
              ${r.row===8?'<div style="font-family:var(--mono);font-size:9px;color:var(--yellow);margin-top:3px">&#129494; CONTRACTORS</div>':''}
              ${r.row===11?'<div style="font-family:var(--mono);font-size:9px;color:var(--green);margin-top:3px">&#129529; CLEANING</div>':''}
              ${r.row===13?'<div style="font-family:var(--mono);font-size:9px;color:var(--warm);margin-top:3px">&#129494; SIGN-OFF</div>':''}
              ${r.row===14?'<div style="font-family:var(--mono);font-size:9px;color:var(--yellow);margin-top:3px">&#128274; CLOSE + SUMMARY</div>':''}
            </div>`).join('')}
        </div>
        <button class="next-btn" id="startBtn" onclick="startWizard()" disabled style="width:100%">START WALKABOUT &#8594;</button>
      </div>
    </div>`;
}

function selectRow(row, el) {
  sheetRow = row;
  document.querySelectorAll('.row-opt').forEach(e=>{ e.style.borderColor='var(--border2)'; e.style.background='var(--raised)'; });
  el.style.borderColor = 'var(--accent)';
  el.style.background  = 'var(--accent-dim)';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('pillStep').textContent = 'ROW ' + row;
}

function startWizard() {
  data={}; specialData={}; history=[]; maintItems=[];
  zoneIdx=0; stepIdx=0; specialStepIdx=0;
  phase = 'special';
  specialSteps = getSpecialSteps(sheetRow);
  document.getElementById('progressTrack').style.display = 'block';
  renderZoneDots();
  specialSteps.length > 0 ? renderSpecialStep() : (phase='zones', renderStep());
}

// ═══════════════════════════════════════════════════════════
// BACK NAVIGATION
// ═══════════════════════════════════════════════════════════
function pushHistory() {
  history.push({ phase, zoneIdx, stepIdx, specialStepIdx });
}

function goBack() {
  if (history.length === 0) { startOver(); return; }
  const prev = history.pop();
  phase           = prev.phase;
  zoneIdx         = prev.zoneIdx;
  stepIdx         = prev.stepIdx;
  specialStepIdx  = prev.specialStepIdx;
  if (phase === 'special') renderSpecialStep();
  else renderStep();
}

// ═══════════════════════════════════════════════════════════
// SPECIAL STEPS
// ═══════════════════════════════════════════════════════════
function getSpecialSteps(row) {
  if (row===6)  return ['breakers','lights','toilets_blocked','toilet_seats'];
  if (row===7)  return ['lights'];
  if (row===8)  return ['lights','contractors_yn'];
  if (row===11) return ['cleaning_yn'];
  if (row===13) return ['contractors_status'];
  return [];
}

function renderSpecialStep() {
  if (specialStepIdx >= specialSteps.length) { phase='zones'; renderStep(); return; }
  const step  = specialSteps[specialStepIdx];
  const total = specialSteps.length;
  const num   = specialStepIdx + 1;
  document.getElementById('pgZoneName').textContent = 'Special Check';
  document.getElementById('pgCount').textContent    = `${num} / ${total}`;
  document.getElementById('pgFill').style.width     = '5%';
  document.getElementById('pillStep').textContent   = `ROW ${sheetRow} CHECK`;

  let html = '';
  if      (step==='breakers')          html = buildBreakersStep();
  else if (step==='lights')            html = buildLightsStep();
  else if (step==='toilets_blocked')   html = buildMultiCheck('toilets_blocked','&#128701; Blocked Toilets','Are there any blocked toilets?',[{id:'toilet_gf',label:'Ground Floor'},{id:'toilet_1f',label:'1st Floor'},{id:'toilet_2f',label:'2nd Floor'}]);
  else if (step==='toilet_seats')      html = buildMultiCheck('toilet_seats','&#129681; Damaged Toilet Seats','Are there any damaged toilet seats?',[{id:'seat_gf',label:'Ground Floor'},{id:'seat_1f',label:'1st Floor'},{id:'seat_2f',label:'2nd Floor'}]);
  else if (step==='contractors_yn')    html = buildContractorsStep();
  else if (step==='cleaning_yn')       html = buildCleaningStep();
  else if (step==='contractors_status')html = buildContractorStatusStep();

  document.getElementById('wizardArea').innerHTML =
    `<div class="q-card"><div class="q-top"><span class="q-step-badge">CHECK ${num} OF ${total}</span><span class="q-zone-tag">ROW ${sheetRow} SPECIAL</span></div><div class="q-body">${html}</div></div>`;
}

// ── Breakers ────────────────────────────────────────────────
function buildBreakersStep() {
  const items=[{id:'cb_tripped',label:'Circuit Breaker Tripped',icon:'&#9889;'},{id:'ac_tripped',label:'AC Unit Tripped',icon:'&#10052;&#65039;'}];
  return `
    <div class="q-label">&#9889; Circuit Breakers &amp; AC Units</div>
    <div class="q-sublabel">// Have any tripped since last round?</div>
    ${items.map(it=>`
      <div class="special-item" id="br-row-${it.id}">
        <div class="special-item-title">${it.icon} ${it.label}</div>
        <div class="field-label">HAS IT TRIPPED?</div>
        <div class="yn-small" style="margin-bottom:0">
          <div class="yn-small-btn" id="br-yes-${it.id}" onclick="setBreakerYN('${it.id}','yes')">&#128997; YES</div>
          <div class="yn-small-btn" id="br-no-${it.id}"  onclick="setBreakerYN('${it.id}','no')">&#128994; NO</div>
        </div>
        <div class="detail-section" id="br-det-${it.id}">
          <div class="field-label" style="margin-top:10px">POWER / UNIT RESTORED?</div>
          <div class="yn-small">
            <div class="yn-small-btn" id="br-rest-yes-${it.id}" onclick="setBreakerRestored('${it.id}','yes')">&#10003; Restored</div>
            <div class="yn-small-btn" id="br-rest-no-${it.id}"  onclick="setBreakerRestored('${it.id}','no')">&#128222; Log Call</div>
          </div>
          <input class="txt-input" style="margin-top:8px" placeholder="Notes — location, area affected..." id="br-note-${it.id}">
        </div>
      </div>`).join('')}
    <div class="nav-row">
      <button class="back-btn" onclick="goBack()">&#8592; Back</button>
      <button class="next-btn" onclick="confirmBreakers()">CONFIRM &amp; NEXT &#8594;</button>
    </div>
    <button class="skip-btn" onclick="advanceSpecial()">Skip this check</button>`;
}
function setBreakerYN(id,val){
  const y=document.getElementById('br-yes-'+id),n=document.getElementById('br-no-'+id),d=document.getElementById('br-det-'+id),r=document.getElementById('br-row-'+id);
  y.className='yn-small-btn'+(val==='yes'?' s-yes':''); n.className='yn-small-btn'+(val==='no'?' s-no':'');
  y.dataset.sel=val==='yes'?'1':''; n.dataset.sel=val==='no'?'1':'';
  d.className='detail-section'+(val==='yes'?' open':''); r.style.borderColor=val==='yes'?'var(--red)':'var(--border2)';
}
function setBreakerRestored(id,val){
  const y=document.getElementById('br-rest-yes-'+id),n=document.getElementById('br-rest-no-'+id);
  y.className='yn-small-btn'+(val==='yes'?' s-fixed':''); n.className='yn-small-btn'+(val==='no'?' s-call':'');
  y.dataset.sel=val==='yes'?'1':''; n.dataset.sel=val==='no'?'1':'';
}
function confirmBreakers(){
  specialData.breakers={};
  ['cb_tripped','ac_tripped'].forEach(id=>{
    const tripped=document.getElementById('br-yes-'+id)?.dataset?.sel==='1';
    const restored=document.getElementById('br-rest-yes-'+id)?.dataset?.sel==='1';
    const logCall=document.getElementById('br-rest-no-'+id)?.dataset?.sel==='1';
    const note=document.getElementById('br-note-'+id)?.value||'';
    specialData.breakers[id]={tripped,restored:tripped?restored:null,logCall:tripped?logCall:false,note};
  });
  advanceSpecial(); showToast('Breaker check saved ✓','ok');
}

// ── Lights ──────────────────────────────────────────────────
function buildLightsStep(){
  const floors=[{id:'lt_gf',label:'Ground Floor'},{id:'lt_1fn',label:'1st Floor North'},{id:'lt_1fe',label:'1st Floor East'},{id:'lt_1fs',label:'1st Floor South'},{id:'lt_2fn',label:'2nd Floor North'},{id:'lt_2fe',label:'2nd Floor East'},{id:'lt_2fs',label:'2nd Floor South'},{id:'lt_can',label:'Canteen'}];
  return `
    <div class="q-label">&#128161; Faulty Lights</div>
    <div class="q-sublabel">// Any faulty lights per zone?</div>
    ${floors.map(fl=>`
      <div class="special-item" id="lt-row-${fl.id}">
        <div class="special-item-title">&#128161; ${fl.label}</div>
        <div class="yn-small" style="margin-bottom:0">
          <div class="yn-small-btn" id="lt-yes-${fl.id}" onclick="setLightYN('${fl.id}','yes')">&#128997; YES</div>
          <div class="yn-small-btn" id="lt-no-${fl.id}"  onclick="setLightYN('${fl.id}','no')">&#128994; NO</div>
        </div>
        <div class="detail-section" id="lt-det-${fl.id}">
          <div class="field-label" style="margin-top:10px">LIGHTS REPLACED / FIXED?</div>
          <div class="yn-small">
            <div class="yn-small-btn" id="lt-fix-yes-${fl.id}" onclick="setLightFixed('${fl.id}','yes')">&#10003; Fixed</div>
            <div class="yn-small-btn" id="lt-fix-no-${fl.id}"  onclick="setLightFixed('${fl.id}','no')">&#128222; Log Call</div>
          </div>
          <input class="txt-input" style="margin-top:8px" placeholder="Notes — which lights, how many, location..." id="lt-note-${fl.id}">
        </div>
      </div>`).join('')}
    <div class="nav-row">
      <button class="back-btn" onclick="goBack()">&#8592; Back</button>
      <button class="next-btn" onclick="confirmLights()">CONFIRM &amp; NEXT &#8594;</button>
    </div>
    <button class="skip-btn" onclick="advanceSpecial()">Skip this check</button>`;
}
function setLightYN(id,val){
  const y=document.getElementById('lt-yes-'+id),n=document.getElementById('lt-no-'+id),d=document.getElementById('lt-det-'+id),r=document.getElementById('lt-row-'+id);
  y.className='yn-small-btn'+(val==='yes'?' s-yes':''); n.className='yn-small-btn'+(val==='no'?' s-no':'');
  y.dataset.sel=val==='yes'?'1':''; n.dataset.sel=val==='no'?'1':'';
  d.className='detail-section'+(val==='yes'?' open':''); r.style.borderColor=val==='yes'?'var(--red)':'var(--border2)';
}
function setLightFixed(id,val){
  const y=document.getElementById('lt-fix-yes-'+id),n=document.getElementById('lt-fix-no-'+id);
  y.className='yn-small-btn'+(val==='yes'?' s-fixed':''); n.className='yn-small-btn'+(val==='no'?' s-call':'');
  y.dataset.sel=val==='yes'?'1':''; n.dataset.sel=val==='no'?'1':'';
}
function confirmLights(){
  const floors=['lt_gf','lt_1fn','lt_1fe','lt_1fs','lt_2fn','lt_2fe','lt_2fs','lt_can'];
  specialData.lights={};
  floors.forEach(id=>{
    const faulty=document.getElementById('lt-yes-'+id)?.dataset?.sel==='1';
    const fixed=document.getElementById('lt-fix-yes-'+id)?.dataset?.sel==='1';
    const logCall=document.getElementById('lt-fix-no-'+id)?.dataset?.sel==='1';
    const note=document.getElementById('lt-note-'+id)?.value||'';
    specialData.lights[id]={faulty,fixed:faulty?fixed:null,logCall:faulty?logCall:false,note};
  });
  advanceSpecial(); showToast('Lights check saved ✓','ok');
}

// ── Multi Check (toilets/seats) ─────────────────────────────
function buildMultiCheck(stepId,title,question,items){
  return `
    <div class="q-label">${title}</div>
    <div class="q-sublabel">${question}</div>
    ${items.map(it=>`
      <div class="special-item" id="check-row-${it.id}">
        <div style="display:flex;align-items:center;gap:10px">
          <div onclick="toggleCheck('${it.id}')" id="chk-${it.id}"
            style="width:22px;height:22px;border:2px solid var(--border2);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .15s"></div>
          <div style="font-size:13px;font-weight:500;flex:1">${it.label}</div>
        </div>
        <div class="detail-section" id="action-${it.id}">
          <div class="field-label" style="margin-top:10px">ACTION TAKEN</div>
          <div class="yn-small">
            <div class="yn-small-btn" id="act-rect-${it.id}" onclick="setAction('${it.id}','rectified')">&#10003; Rectified</div>
            <div class="yn-small-btn" id="act-call-${it.id}" onclick="setAction('${it.id}','call')">&#128222; Log Call</div>
          </div>
          <input class="txt-input" style="margin-top:8px" placeholder="Notes..." id="note-${it.id}">
        </div>
      </div>`).join('')}
    <div class="nav-row">
      <button class="back-btn" onclick="goBack()">&#8592; Back</button>
      <button class="next-btn" onclick='confirmMultiCheck("${stepId}",${JSON.stringify(items)})'>CONFIRM &amp; NEXT &#8594;</button>
    </div>
    <button class="skip-btn" onclick="advanceSpecial()">Skip this check</button>`;
}
function toggleCheck(id){
  const chk=document.getElementById('chk-'+id),det=document.getElementById('action-'+id),row=document.getElementById('check-row-'+id);
  const active=chk.textContent==='\u2713';
  if(active){chk.textContent='';chk.style.borderColor='var(--border2)';chk.style.background='';chk.style.color='';det.className='detail-section';row.style.borderColor='var(--border2)';}
  else{chk.textContent='\u2713';chk.style.borderColor='var(--red)';chk.style.background='var(--red-dim)';chk.style.color='var(--red)';det.className='detail-section open';row.style.borderColor='var(--red)';}
}
function setAction(id,action){
  const rEl=document.getElementById('act-rect-'+id),cEl=document.getElementById('act-call-'+id);
  rEl.className='yn-small-btn'+(action==='rectified'?' s-fixed':''); cEl.className='yn-small-btn'+(action==='call'?' s-call':'');
  rEl.dataset.sel=action==='rectified'?'1':''; cEl.dataset.sel=action==='call'?'1':'';
}
function confirmMultiCheck(stepId,items){
  if(!specialData[stepId])specialData[stepId]={};
  items.forEach(it=>{
    const checked=document.getElementById('chk-'+it.id)?.textContent==='\u2713';
    const rect=document.getElementById('act-rect-'+it.id)?.dataset?.sel==='1';
    const call=document.getElementById('act-call-'+it.id)?.dataset?.sel==='1';
    const note=document.getElementById('note-'+it.id)?.value||'';
    specialData[stepId][it.id]={found:checked,action:checked?(rect?'Rectified':call?'Log Call':'Noted'):'None',note};
  });
  advanceSpecial();
}

// ── Contractors ─────────────────────────────────────────────
function buildContractorsStep(){
  return `
    <div class="q-label">&#129494; Contractors On Site?</div>
    <div class="q-sublabel">// Are there any contractors on site right now?</div>
    <div class="yn-row">
      <div class="yn-btn" id="yn-yes" onclick="selectContractors(true)"><span class="yn-icon">&#129494;</span>YES</div>
      <div class="yn-btn" id="yn-no"  onclick="selectContractors(false)"><span class="yn-icon">&#10003;</span>NO</div>
    </div>
    <div id="ct-wrap" style="display:none;margin-bottom:14px">
      <div class="field-label">CONTRACTOR NAME / COMPANY</div>
      <input class="temp-edit" id="ctName" style="width:100%;font-size:14px;padding:10px 12px;margin-bottom:10px" placeholder="Enter name or company...">
      <div class="field-label">WORK AREA / DESCRIPTION</div>
      <input class="temp-edit" id="ctWork" style="width:100%;font-size:14px;padding:10px 12px" placeholder="e.g. Plumbing - 2nd Floor bathrooms...">
    </div>

  else if(step==='room'){tempRoom=null; body=buildPhotoStep('room','&#127777;&#65039; Take photo of the room thermometer','Point camera at the room sensor / thermometer',`Combined &#8594; Column ${zone.cols.ac}, Row ${sheetRow}`,'room');}

// ═══════════════════════════════════════════════════════════
// PHOTO HANDLING — saves b64 to photos array
// ═══════════════════════════════════════════════════════════
function triggerPhoto(type){document.getElementById('fi-'+type).click();}

async function handlePhoto(event,type){
  const file=event.target.files[0]; if(!file)return;
  event.target.value='';
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64full=e.target.result;
    const b64=b64full.split(',')[1];
    const img=document.getElementById('pimg-'+type);
    if(img){img.src=b64full;img.classList.add('show');}
    const pr=document.getElementById('pprompt-'+type); if(pr)pr.style.display='none';
    const pz=document.getElementById('pzone-'+type); if(pz)pz.classList.add('captured');

    // Save photo
    const zone=ZONES[zoneIdx];
    const existing=photos.findIndex(p=>p.zone===zone.id&&p.row===sheetRow&&p.type===type);
    const photoEntry={id:Date.now(),type,zone:zone.id,zoneLabel:zone.label,row:sheetRow,b64:b64full,timestamp:nowStr()};
    if(existing>=0)photos[existing]=photoEntry; else photos.push(photoEntry);

    const scanEl=document.getElementById('scan-'+type);
    if(scanEl)scanEl.classList.add('show');

    try{
      const temp=await readTempFromPhoto(b64,type);
      if(scanEl)scanEl.classList.remove('show');
      showPhotoResult(type,temp);
      if(type==='ac')tempAC=temp;
      if(type==='room')tempRoom=temp;
      enableNext();
      showToast((type==='ac'?'AC':'Room')+': '+temp+'°C ✓','ok');
    }catch(err){
      if(scanEl)scanEl.classList.remove('show');
      showPhotoResult(type,null);
      showToast('Photo saved — enter temperature manually','ok');
    }
  };
  reader.readAsDataURL(file);
}

async function readTempFromPhoto(b64,type){
  const isAC=type==='ac';
  const prompt=isAC
    ?'This is an AC/aircon control panel. Return ONLY the numeric SET POINT temperature as a number like 24.0. No units. If two numbers pick the SET POINT. Valid range 10-40. If unreadable reply: UNREADABLE'
    :'This is a room thermometer/sensor. Return ONLY the numeric ACTUAL room temperature as a number like 23.1. No units. If two numbers pick the CURRENT reading. Valid range 10-40. If unreadable reply: UNREADABLE';
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:20,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
  if(!res.ok)throw new Error('api');
  const d=await res.json();
  const raw=d.content?.map(c=>c.text||'').join('').trim();
  if(!raw||raw==='UNREADABLE')throw new Error('unreadable');
  const n=parseFloat(raw.replace(/[^0-9.]/g,''));
  if(isNaN(n)||n<10||n>40)throw new Error('range');
  return Math.round(n*10)/10;
}

function showPhotoResult(type,temp){
  const r=document.getElementById('result-'+type),t=document.getElementById('rtemp-'+type),e=document.getElementById('tedit-'+type);
  if(!r)return; r.classList.add('show');
  if(temp!==null){t.textContent=temp+'°C';t.style.color='';if(e)e.value=temp;}
  else{t.textContent='?';t.style.color='var(--red)';if(e){e.value='';e.focus();}}
}
function manualTemp(type,val){
  const n=parseFloat(val);
  if(!isNaN(n)&&n>=10&&n<=40){
    if(type==='ac'){tempAC=Math.round(n*10)/10;const el=document.getElementById('rtemp-ac');if(el)el.textContent=tempAC+'°C';}
    if(type==='room'){tempRoom=Math.round(n*10)/10;const el=document.getElementById('rtemp-room');if(el)el.textContent=tempRoom+'°C';}
    enableNext();
  }
}
function enableNext(){const b=document.getElementById('nextBtn');if(b)b.disabled=false;}

    </div>
  </div>`;
}

function toggleMaintCat(catId){
  const body=document.getElementById('maint-body-'+catId);
  const arrow=document.getElementById('maint-arrow-'+catId);
  if(!body)return;
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  if(arrow)arrow.textContent=open?'▴':'▾';
  if(open && maintItems.filter(m=>m.category===catId).length===0) addMaintItem(catId);
}

function addMaintItem(catId){
  maintItems.push({id:Date.now(),category:catId,description:'',status:'done',notes:''});
  renderMaintCat(catId);
  const body=document.getElementById('maint-body-'+catId);
  const arrow=document.getElementById('maint-arrow-'+catId);
  if(body)body.style.display='block';
  if(arrow)arrow.textContent='▴';
}

function renderMaintCat(catId){
  const el=document.getElementById('maint-items-'+catId);
  if(!el)return;
  const items=maintItems.filter(m=>m.category===catId);
  const countEl=document.getElementById('maint-count-'+catId);
  if(countEl)countEl.textContent=items.length>0?items.length+' item'+(items.length!==1?'s':''):'';
  if(items.length===0){el.innerHTML='';return;}
  const statuses=[
    {s:'done',label:'✅ Completed'},{s:'pending',label:'⏳ Pending'},
    {s:'logged',label:'📞 Call Logged'},{s:'contractor',label:'🦺 Contractor'}
  ];
  el.innerHTML=items.map((item,li)=>{
    const gi=maintItems.indexOf(item);
    return `<div style="background:var(--faint);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px">
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px">ITEM ${li+1}</div>
      <input class="txt-input" style="margin-bottom:6px" placeholder="Description — what was done or reported..."
        value="${item.description.replace(/"/g,'&quot;')}" oninput="maintItems[${gi}].description=this.value">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
        ${statuses.map(opt=>`
          <div onclick="setMaintStatus(${gi},'${opt.s}','${catId}')"
            style="padding:5px 10px;border:1px solid ${item.status===opt.s?'var(--accent)':'var(--border2)'};border-radius:4px;
                   font-size:11px;cursor:pointer;font-family:var(--mono);transition:all .15s;
                   background:${item.status===opt.s?'var(--accent-dim)':'var(--faint)'};
                   color:${item.status===opt.s?'var(--accent)':'var(--muted)'}">${opt.label}</div>`).join('')}
      </div>
      <input class="txt-input" placeholder="Additional notes..." value="${item.notes.replace(/"/g,'&quot;')}"
        oninput="maintItems[${gi}].notes=this.value">
      <div style="text-align:right;margin-top:6px">
        <span onclick="removeMaintItem(${gi},'${catId}')"
          style="font-family:var(--mono);font-size:10px;color:var(--red);cursor:pointer;letter-spacing:.04em">✕ Remove</span>
      </div>
    </div>`;
  }).join('');
}

function renderMaintList(){
  ['hvac','electrical','plumbing','cleaning','structural','safety','general'].forEach(c=>renderMaintCat(c));
}

function setMaintCat(i,cat){ maintItems[i].category=cat; renderMaintList(); }
function setMaintStatus(i,s,catId){ maintItems[i].status=s; renderMaintCat(catId); }
function removeMaintItem(i,catId){ maintItems.splice(i,1); renderMaintCat(catId); }

function completeMaintenance(){
  document.getElementById('wizardArea').innerHTML='';
  document.getElementById('doneScreen').classList.add('show');
  document.getElementById('doneSub').textContent=
    Object.keys(data).length+' of '+ZONES.length+' zones · Row '+sheetRow+' · '+
    photos.length+' photos · '+maintItems.length+' maintenance item'+(maintItems.length!==1?'s':'')+' logged.';
  document.getElementById('pillStep').textContent='DONE';
  if(sheetRow===14)document.getElementById('waRow').style.display='flex';
}

function startOver(){
  data={};specialData={};photos=[];history=[];maintItems=[];
  zoneIdx=0;stepIdx=0;specialStepIdx=0;phase='zones';specialSteps=[];
  document.getElementById('doneScreen').classList.remove('show');
  ['reviewArea','photoLogArea','waArea','maintArea','dayReportArea','scriptArea'].forEach(id=>{
    const el=document.getElementById(id); if(el)el.innerHTML='';
  });
  const wr=document.getElementById('waRow'); if(wr)wr.style.display='none';
  showRowSelector();
}
